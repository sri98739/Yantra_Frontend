server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Used by Docker/Kubernetes probes and the dashboard's status check.
  location = /healthz {
    default_type text/plain;
    return 200 "ok";
  }

  location = / {
    try_files /home.html =404;
  }

  location / {
    try_files $uri =404;
  }
}
