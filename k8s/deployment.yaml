apiVersion: apps/v1
kind: Deployment
metadata:
  name: yantra-frontend
  namespace: yantra
  labels:
    app: yantra-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yantra-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: yantra-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101   # the "nginx" user in nginx-unprivileged
      containers:
        - name: web
          # Jenkins replaces this with the image it just built (see the Jenkinsfile deploy stage).
          # For a manual local deploy, build it first: docker build -t yantra-frontend:latest .
          image: yantra-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # nginx needs a writable /tmp for its pid file and temp dirs.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
