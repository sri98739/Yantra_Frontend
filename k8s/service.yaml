# NodePort so it works on local clusters (Docker Desktop, minikube) without an ingress:
#   Docker Desktop -> http://localhost:30080
#   minikube       -> minikube service yantra-frontend -n yantra
apiVersion: v1
kind: Service
metadata:
  name: yantra-frontend
  namespace: yantra
  labels:
    app: yantra-frontend
spec:
  type: NodePort
  selector:
    app: yantra-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
